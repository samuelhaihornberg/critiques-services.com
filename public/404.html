<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="Critiques Services - Plateforme de critiques de services avec preuves vidéo" />
    <title>Critiques Services</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      :root {
        --bg-primary: #0f0f1a;
        --bg-secondary: #1a1a2e;
        --bg-tertiary: #16213e;
        --accent-primary: #e94560;
        --accent-secondary: #ff6b6b;
        --text-primary: #ffffff;
        --text-secondary: #b8b8d0;
        --text-muted: #8888a0;
        --border-color: #2a2a4a;
        --success: #00d47e;
        --warning: #ffb800;
        --error: #ff4757;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 20px;
        --radius-full: 9999px;
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      .spa-fallback { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; text-align: center; }
      .spa-fallback .icon { font-size: 4rem; margin-bottom: 1rem; }
      .spa-fallback h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 800; margin-bottom: 1rem; background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
      .spa-fallback p { color: var(--text-secondary); margin-bottom: 2rem; max-width: 400px; margin-left: auto; margin-right: auto; }
      .spa-fallback .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.875rem 1.5rem; border-radius: var(--radius-md); font-weight: 600; font-size: 0.95rem; text-decoration: none; border: 2px solid transparent; background: var(--accent-primary); color: var(--text-primary); border-color: var(--accent-primary); }
      .spa-fallback .btn:hover { background: var(--accent-secondary); border-color: var(--accent-secondary); }
      .leaflet-container { font-family: inherit; background: var(--bg-tertiary); }
      .leaflet-popup-content-wrapper { background: var(--bg-secondary); color: var(--text-primary); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); }
      .leaflet-popup-tip { background: var(--bg-secondary); }
      .leaflet-control-attribution { background: rgba(26, 26, 46, 0.9) !important; color: var(--text-muted) !important; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="spa-fallback" id="spa-fallback">
        <div class="icon">⚖️</div>
        <h1>Critiques Services</h1>
        <p>Chargement de l'application...</p>
        <a href="/" class="btn" onclick="location.reload()">Actualiser</a>
      </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide fallback when React mounts
      const root = document.getElementById('root');
      const fallback = document.getElementById('spa-fallback');
      const observer = new MutationObserver(() => {
        if (root.children.length > 1 || (root.firstChild && root.firstChild !== fallback)) {
          fallback.style.display = 'none';
          observer.disconnect();
        }
      });
      observer.observe(root, { childList: true, subtree: true });
      // Fallback timeout
      setTimeout(() => { fallback.style.opacity = '0.5'; }, 5000);
      setTimeout(() => { fallback.style.display = 'none'; }, 10000);
    </script>
  </body>
</html>
